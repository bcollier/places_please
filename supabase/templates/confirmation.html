<!doctype html>
<html>
  <body style="margin:0;padding:32px 16px;background:#F7F6F4;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;color:#111111;">
    <div style="max-width:440px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px;border:1px solid #E0E0E0;">
      <p style="margin:0 0 4px;font-size:12px;letter-spacing:1.2px;font-weight:700;color:#C41230;text-transform:uppercase;">Places, Please</p>
      <h1 style="margin:0 0 16px;font-family:Georgia,'Times New Roman',serif;font-size:26px;line-height:32px;">Confirm your email</h1>
      <p style="margin:0 0 20px;font-size:16px;line-height:24px;color:#6D6E71;">Enter this code in the app to finish signing in.</p>
      <p style="margin:0 0 20px;font-size:34px;letter-spacing:8px;font-weight:700;text-align:center;color:#111111;">{{ .Token }}</p>
      <p style="margin:0;font-size:13px;line-height:18px;color:#6D6E71;">The code expires in an hour. If you didn't ask for it, you can ignore this email.</p>
    </div>
  </body>
</html>
